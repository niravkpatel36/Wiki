{% extends "encyclopedia/layout.html" %}

{% block title %}Create New Page{% endblock %}

{% block body %}
  <h1>Create a New Page</h1>
  <form method="post">
    {% csrf_token %}
    <div>
      {{ form.title.label_tag }}<br/>
      {{ form.title }}
    </div>
    <div>
      {{ form.content.label_tag }}<br/>
      {{ form.content }}
    </div>
    <button type="submit">Save</button>
  </form>
{% endblock %}
