{% extends "encyclopedia/layout.html" %}

{% block title %}Edit {{ title }}{% endblock %}

{% block body %}
  <h1>Edit: {{ title }}</h1>
  <form method="post">
    {% csrf_token %}
    <div>
      <label>Title</label><br/>
      <input type="text" value="{{ title }}" disabled>
    </div>
    <div>
      {{ form.content.label_tag }}<br/>
      {{ form.content }}
    </div>
    <button type="submit">Save</button>
  </form>
{% endblock %}
