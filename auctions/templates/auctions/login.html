{% extends "auctions/layout.html" %}
{% block body %}
  <h1>Log In</h1>
  <form method="post">
    {% csrf_token %}
    <label>Username</label><br>
    <input name="username" required><br>
    <label>Password</label><br>
    <input type="password" name="password" required><br><br>
    <button type="submit">Log In</button>
  </form>
{% endblock %}
